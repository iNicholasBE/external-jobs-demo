spring.application.name=external-jobs-demo
server.port=8080

# --- Database ---
spring.datasource.url=jdbc:postgresql://localhost:5432/demo
spring.datasource.username=postgres
spring.datasource.password=password


# --- JobRunr Pro ---
jobrunr.dashboard.enabled=true
jobrunr.dashboard.type=embedded
jobrunr.background-job-server.enabled=true
jobrunr.background-job-server.worker-count=4

# Priority queues: high-prio jobs are processed before low-prio
jobrunr.queues.names=high-prio,low-prio
jobrunr.queues.default-queue-name=low-prio

# --- Replicate (GPU video generation) ---
replicate.api-token=${REPLICATE_API_TOKEN:r8_placeholder}

# --- Gemini (async generation with webhooks) ---
# Get an API key at https://aistudio.google.com/apikey
gemini.api-key=${GEMINI_API_KEY:}
# A publicly reachable URL pointing at this app (e.g. https://abc.ngrok.app).
# Required for Gemini's webhook to call us back.
gemini.public-url=${GEMINI_PUBLIC_URL:}
gemini.api-base=https://generativelanguage.googleapis.com/v1beta
# The webhook docs use gemini-3-flash-preview with :batchCreate. Override if your
# project doesn't have access (e.g. set gemini.model=gemini-2.5-flash).
gemini.model=gemini-3-flash-preview
# Veo video generation model used by the /gemini-video demo.
gemini.video-model=veo-3.0-generate-001
gemini.webhook.path=/gemini/webhook
gemini.webhook.secret-file=.gemini-webhook.json

# --- Dev ---
spring.thymeleaf.cache=false
